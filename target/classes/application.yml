server:
  port: 8125
  servlet:
    context-path:  /api

spring:
  application:
    name: lwt-pic-backend
    #数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cloud_picture
    username: root
    password: 123456
mybatis-plus:
  configuration:
      # MyBatis 配置
    map-underscore-to-camel-case: false
      # 开发环境打印日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete #全局逻辑删除
      logic-delete-value: 1 #逻辑删除
      logic-not-delete-value: 0 #逻辑未删除
#接口文档
knife4j:
  enable: true
  openapi:
    title: 接口文档

    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.lwt.cloudpicture.controller
